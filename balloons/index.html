<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>🎈 氣球數字大冒險 🏹</title>

  <!-- 📌 iPhone 桌面 App 圖示：它會去抓您上傳到 GitHub 的 custom-icon.png 照片 -->
  <link rel="apple-touch-icon" href="custom-icon.png">
  <link rel="icon" type="image/png" href="custom-icon.png">

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Zen+Maru+Gothic:wght@700;900&display=swap" rel="stylesheet">

  <style>
    * {
      touch-action: manipulation;
      user-select: none;
      -webkit-user-select: none;
      box-sizing: border-box;
    }
    body {
      font-family: 'Zen Maru Gothic', 'Baloo 2', sans-serif;
      margin: 0;
      padding: 0;
      overflow: hidden;
      width: 100vw;
      height: 100vh;
      background: linear-gradient(180deg, #8FD3F4 0%, #B9E8FF 55%, #DFF6DA 100%);
    }

    /* 氣球飛升關鍵動畫關鍵幀 */
    @keyframes riseUp {
      0% {
        transform: translateY(100vh) scale(0.9);
        opacity: 0.95;
      }
      100% {
        transform: translateY(-130vh) scale(1);
        opacity: 0.95;
      }
    }

    @keyframes swayX {
      0%, 100% { transform: translateX(-5px) rotate(-3deg); }
      50% { transform: translateX(5px) rotate(3deg); }
    }

    @keyframes shakeErr {
      0%, 100% { transform: scale(1) rotate(0deg); }
      20% { transform: scale(1.1) rotate(-8deg); }
      40% { transform: scale(1.1) rotate(8deg); }
      60% { transform: scale(1.1) rotate(-8deg); }
      80% { transform: scale(1.1) rotate(8deg); }
    }

    @keyframes popBoom {
      0% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.8; transform: scale(1.4); }
      100% { opacity: 0; transform: scale(0.1); }
    }

    @keyframes floatUp {
      0% { opacity: 1; transform: translateY(0) scale(1); }
      100% { opacity: 0; transform: translateY(-80px) scale(1.4); }
    }

    .balloon-rising {
      animation: riseUp var(--rise-duration, 7s) linear forwards;
    }

    .balloon-sway {
      animation: swayX 2.2s ease-in-out infinite;
    }

    .balloon-pop {
      animation: popBoom 0.4s ease-out forwards !important;
    }

    .balloon-shake {
      animation: shakeErr 0.4s ease-in-out !important;
    }

    /* 可愛立體按鈕 */
    .btn-cute {
      box-shadow: 0 8px 0 0 rgba(0, 0, 0, 0.15), inset 0 3px 0 rgba(255, 255, 255, 0.6);
      transition: all 0.12s ease;
    }
    .btn-cute:active {
      transform: translateY(4px);
      box-shadow: 0 4px 0 0 rgba(0, 0, 0, 0.15), inset 0 2px 0 rgba(255, 255, 255, 0.6);
    }

    /* 氣球容器與本體 */
    .balloon-wrapper {
      position: absolute;
      bottom: -150px;
      cursor: pointer;
      z-index: 25;
      will-change: transform;
    }

    .balloon-body {
      width: clamp(85px, 18vw, 120px);
      height: clamp(105px, 22vw, 145px);
      border-radius: 50% 50% 50% 50% / 60% 60% 40% 40%;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: inset -10px -10px 18px rgba(0,0,0,0.2), inset 10px 10px 18px rgba(255,255,255,0.7), 0 8px 15px rgba(0,0,0,0.15);
    }

    .balloon-string {
      width: 3px;
      height: 50px;
      background: rgba(138, 122, 92, 0.7);
      margin: 0 auto;
    }

    .particle {
      position: fixed;
      pointer-events: none;
      z-index: 9999;
      animation: floatUp 0.9s ease-out forwards;
    }
  </style>
</head>
<body class="relative flex flex-col justify-between select-none overflow-hidden h-screen w-screen">

  <!-- 背景天空與城堡裝飾 -->
  <div class="absolute inset-0 pointer-events-none z-0 overflow-hidden">
    <div class="absolute top-[4%] left-[8%] text-5xl opacity-80 animate-pulse">☁️</div>
    <div class="absolute top-[9%] left-[62%] text-4xl opacity-80 animate-pulse">☁️</div>
    <div class="absolute top-[3%] left-[82%] text-3xl opacity-70">☁️</div>
    <div class="absolute bottom-0 left-[45%] text-8xl sm:text-9xl opacity-80">🏰</div>
    <div class="absolute -bottom-3 inset-x-0 h-[12%] bg-emerald-400 rounded-t-[100%]"></div>
  </div>

  <!-- Toast 訊息提示區域 -->
  <div id="toast-el" class="hidden fixed top-4 left-1/2 -translate-x-1/2 bg-amber-100 border-2 border-amber-400 text-amber-900 font-black px-6 py-2 rounded-full shadow-2xl z-50 text-xl animate-bounce">
  </div>

  <!-- 頂部資訊工具列 -->
  <header class="relative z-40 w-full max-w-5xl mx-auto p-3 flex items-center justify-between gap-2">
    <!-- 切換玩家 -->
    <button onclick="openUserModal()" class="btn-cute bg-white/90 text-amber-900 font-black text-lg sm:text-2xl px-4 py-2 rounded-2xl border-2 border-amber-300 flex items-center space-x-2">
      <span>👑</span>
      <span id="current-user-name">小寶貝</span>
      <i class="fas fa-sync-alt text-sm"></i>
    </button>

    <!-- 星星金幣 -->
    <div class="bg-white/90 border-2 border-amber-300 rounded-2xl px-4 py-2 flex items-center space-x-2 shadow-sm">
      <span class="text-3xl text-amber-400">⭐</span>
      <span id="user-stars" class="text-3xl font-black text-amber-900">0</span>
    </div>

    <!-- 功能鈕 -->
    <div class="flex space-x-2">
      <button id="home-nav-btn" onclick="goHome()" class="btn-cute bg-white/90 text-gray-700 font-black p-3 rounded-2xl border-2 border-gray-200">
        <i class="fas fa-home text-2xl"></i>
      </button>
      <button onclick="toggleSound()" class="btn-cute bg-white/90 text-gray-700 font-black p-3 rounded-2xl border-2 border-gray-200">
        <i id="soundIcon" class="fas fa-volume-up text-2xl"></i>
      </button>
    </div>
  </header>

  <!-- 主畫面檢視區 -->
  <main class="relative z-10 flex-1 w-full max-w-5xl mx-auto flex flex-col items-center justify-between overflow-hidden">

    <!-- ================= 頁面 1: 主選單 ================= -->
    <section id="screen-home" class="w-full flex-1 flex flex-col items-center justify-center p-4 text-center">
      <h1 class="text-4xl sm:text-6xl font-black text-white drop-shadow-[0_4px_4px_rgba(0,0,0,0.3)] mb-2 tracking-wider">
        🎈 氣球數字大冒險 🏹
      </h1>
      <p class="text-xl sm:text-2xl font-bold text-emerald-800 mb-4">
        聽數字、射氣球，趁它飛走前抓住它！
      </p>

      <!-- 英雄角色展示 -->
      <div class="my-2 cursor-pointer transform hover:scale-105 transition-transform" onclick="openShop()">
        <div id="home-archer-container" class="w-[180px] h-[190px]"></div>
        <p id="home-character-name" class="text-xl font-black text-amber-900 mt-1">森林小獵人</p>
      </div>

      <!-- 成就徽章 -->
      <div id="home-achievements" class="flex justify-center gap-3 my-3"></div>

      <!-- 模式選擇 -->
      <div class="w-full max-w-md flex flex-col space-y-3 mt-2">
        <button onclick="startRound(10)" class="btn-cute bg-amber-400 hover:bg-amber-500 text-white font-black text-2xl py-4 rounded-2xl border-2 border-amber-300">
          🎯 1 ～ 10 練習關
        </button>
        <button onclick="startRound(20)" class="btn-cute bg-sky-400 hover:bg-sky-500 text-white font-black text-2xl py-4 rounded-2xl border-2 border-sky-300">
          🚀 1 ～ 20 挑戰關
        </button>
        <button onclick="openShop()" class="btn-cute bg-purple-400 hover:bg-purple-500 text-white font-black text-2xl py-4 rounded-2xl border-2 border-purple-300">
          🛍️ 造型商店
        </button>
      </div>
    </section>

    <!-- ================= 頁面 2: 遊戲進行區域 ================= -->
    <section id="screen-game" class="hidden w-full flex-1 flex flex-col justify-between relative overflow-hidden h-full">
      <!-- 關卡進度與語音報號鈕 -->
      <div class="w-full flex flex-col items-center z-30 pt-1">
        <div id="progress-dots" class="flex space-x-2 mb-2"></div>

        <button onclick="speakTarget()" class="bg-white border-4 border-amber-300 rounded-full px-6 py-3 shadow-xl flex items-center space-x-3 text-amber-900 font-black text-2xl sm:text-3xl animate-bounce">
          <span class="text-3xl text-amber-500">🔊</span>
          <span>射破數字 <span id="target-number-text" class="text-4xl text-red-500 underline mx-1">?</span> 的氣球！</span>
        </button>
      </div>

      <!-- 氣球升起畫布區域 (全螢幕定位) -->
      <div id="balloon-area" class="absolute inset-0 z-20 pointer-events-auto overflow-hidden">
        <!-- 氣球將動態產生並向上飄升 -->
      </div>

      <!-- 底部獵人與弓箭 -->
      <div class="relative z-30 w-full flex justify-start pl-4 pb-2 pointer-events-none">
        <div id="game-archer-container" class="w-[140px] h-[150px]"></div>
      </div>
    </section>

    <!-- ================= 頁面 3: 通關結算 ================= -->
    <section id="screen-result" class="hidden w-full flex-1 flex flex-col items-center justify-center p-6 text-center">
      <div class="text-7xl mb-2 animate-bounce">🎉</div>
      <h2 class="text-4xl sm:text-5xl font-black text-white drop-shadow-[0_4px_4px_rgba(0,0,0,0.3)] mb-4">
        太棒了！這一關完成了！
      </h2>

      <div class="bg-white/90 rounded-3xl p-6 border-4 border-amber-300 shadow-2xl flex items-center space-x-3 text-3xl font-black text-amber-900 mb-6">
        <span class="text-5xl text-amber-400">⭐</span>
        <span>獲得 <span id="result-stars-count" class="text-5xl text-amber-500">0</span> 顆星星</span>
      </div>

      <div class="w-full max-w-sm flex flex-col space-y-3">
        <button onclick="replayCurrentRound()" class="btn-cute bg-amber-400 text-white font-black text-2xl py-4 rounded-2xl border-2 border-amber-300">
          再玩一局 🔄
        </button>
        <button onclick="openShop()" class="btn-cute bg-purple-400 text-white font-black text-2xl py-4 rounded-2xl border-2 border-purple-300">
          去商店逛逛 🛍️
        </button>
        <button onclick="goHome()" class="btn-cute bg-sky-400 text-white font-black text-2xl py-4 rounded-2xl border-2 border-sky-300">
          回首頁 🏠
        </button>
      </div>
    </section>

  </main>

  <!-- ================= 彈出視窗 1: 造型商店 Modal ================= -->
  <div id="shopModal" class="hidden fixed inset-0 bg-black/60 backdrop-blur-sm z-50 flex items-center justify-center p-4">
    <div class="bg-amber-50 rounded-3xl border-4 border-amber-400 p-4 sm:p-6 w-full max-w-2xl text-center shadow-2xl max-h-[90vh] overflow-y-auto">
      <div class="flex items-center justify-between mb-2">
        <h2 class="text-3xl font-black text-amber-900">🛍️ 造型商店</h2>
        <button onclick="closeShop()" class="text-3xl text-amber-900"><i class="fas fa-times"></i></button>
      </div>

      <div class="flex flex-col items-center my-2">
        <div id="shop-preview-container" class="w-[140px] h-[150px]"></div>
        <p id="shop-preview-name" class="text-lg font-black text-amber-900">森林小獵人</p>
      </div>

      <div class="flex justify-center gap-2 mb-4">
        <button onclick="setShopTab('character')" id="tab-btn-character" class="btn-cute px-4 py-2 rounded-xl font-black text-lg bg-amber-400 text-white">角色</button>
        <button onclick="setShopTab('hat')" id="tab-btn-hat" class="btn-cute px-4 py-2 rounded-xl font-black text-lg bg-white text-amber-900">帽子</button>
        <button onclick="setShopTab('shirt')" id="tab-btn-shirt" class="btn-cute px-4 py-2 rounded-xl font-black text-lg bg-white text-amber-900">上衣</button>
        <button onclick="setShopTab('bow')" id="tab-btn-bow" class="btn-cute px-4 py-2 rounded-xl font-black text-lg bg-white text-amber-900">弓箭</button>
      </div>

      <div id="shop-items-grid" class="grid grid-cols-2 gap-3 max-w-lg mx-auto mb-4"></div>

      <button onclick="closeShop()" class="btn-cute bg-amber-400 text-white font-black text-2xl px-10 py-3 rounded-2xl">
        選好了！去開玩 🎯
      </button>
    </div>
  </div>

  <!-- ================= 彈出視窗 2: 多人帳號切換 Modal ================= -->
  <div id="userModal" class="hidden fixed inset-0 bg-black/60 backdrop-blur-sm z-50 flex items-center justify-center p-4">
    <div class="bg-white rounded-3xl border-4 border-amber-400 p-6 w-full max-w-md text-center shadow-2xl">
      <h2 class="text-3xl font-black text-amber-900 mb-4">👑 選擇或輸入你的名字</h2>
      <div id="user-list" class="flex flex-col space-y-3 mb-4"></div>
      <div class="flex space-x-2 mb-4">
        <input id="new-username-input" type="text" placeholder="輸入名字..." maxlength="6" class="flex-1 text-xl font-black p-3 border-2 border-amber-300 rounded-2xl text-center">
        <button onclick="addNewUser()" class="btn-cute bg-emerald-400 text-white font-black text-xl px-5 rounded-2xl">新增</button>
      </div>
      <button onclick="closeUserModal()" class="btn-cute bg-gray-400 text-white font-black text-xl px-8 py-2 rounded-2xl">關閉</button>
    </div>
  </div>

  <script>
    /* ==========================================
       1. 資料與商店設定 Catalog
       ========================================== */
    const CN_DIGITS = ["", "一", "二", "三", "四", "五", "六", "七", "八", "九"];
    function numberToChinese(n) {
      if (n <= 0) return "";
      if (n < 10) return CN_DIGITS[n];
      if (n === 10) return "十";
      if (n < 20) return "十" + CN_DIGITS[n - 10];
      if (n === 20) return "二十";
      return String(n);
    }

    const CHARACTERS = [
      { id: "archer", name: "森林小獵人", price: 0, shirtColor: "#5FB86B", bowColor: "#8B5A2B", accessory: "none", badge: "🏹" },
      { id: "monkeyking", name: "齊天大聖", price: 50, shirtColor: "#E63946", bowColor: "#FFC94A", accessory: "monkey", badge: "🐵" },
      { id: "bullking", name: "牛魔王", price: 50, shirtColor: "#7A2323", bowColor: "#4A1414", accessory: "bull", badge: "🐂" },
      { id: "whiteSword", name: "白羽劍客", price: 45, shirtColor: "#E4ECEF", bowColor: "#7FD3E8", accessory: "maskWhite", badge: "⚔️" },
      { id: "flameGeneral", name: "烈焰戰將", price: 45, shirtColor: "#2E2E38", bowColor: "#FF7A45", accessory: "maskFlame", badge: "🔥" }
    ];

    const HATS = [
      { id: "none", name: "沒有帽子", price: 0, emoji: null },
      { id: "cap", name: "棒球帽", price: 10, emoji: "🧢" },
      { id: "crown", name: "黃金皇冠", price: 25, emoji: "👑" },
      { id: "wizard", name: "魔法巫師帽", price: 30, emoji: "🧙" },
      { id: "party", name: "派對尖帽", price: 15, emoji: "🎉" },
      { id: "graduate", name: "小小博士帽", price: 35, emoji: "🎓" }
    ];

    const SHIRTS = [
      { id: "green", name: "森林綠", price: 0, color: "#5FB86B" },
      { id: "sky", name: "天空藍", price: 12, color: "#4FA8E0" },
      { id: "berry", name: "甜莓粉", price: 12, color: "#FF8FB1" },
      { id: "grape", name: "魔法紫", price: 18, color: "#B18CFF" },
      { id: "gold", name: "榮耀金", price: 30, color: "#FFC94A" },
      { id: "flame", name: "火焰橘", price: 18, color: "#FF7A45" }
    ];

    const BOWS = [
      { id: "wood", name: "木弓", price: 0, color: "#8B5A2B" },
      { id: "fire", name: "烈焰弓", price: 20, color: "#FF5722" },
      { id: "ice", name: "冰晶弓", price: 20, color: "#5FD3E8" },
      { id: "rainbow", name: "彩虹弓", price: 35, color: "#C86DD7" },
      { id: "royal", name: "皇家金弓", price: 35, color: "#FFC94A" }
    ];

    const ACHIEVEMENTS = [
      { id: "a1", min: 10, icon: "🥉", name: "初露鋒芒" },
      { id: "a2", min: 30, icon: "🥈", name: "神射學徒" },
      { id: "a3", min: 60, icon: "🥇", name: "數字神射手" },
      { id: "a4", min: 120, icon: "🏆", name: "傳說射手" }
    ];

    const BALLOON_COLORS = ["#FF6B6B", "#FFB84D", "#5FD3E8", "#B18CFF", "#7FD98A", "#FF8FB1"];
    const CHEERS = ["太棒了！", "答對了！", "你好厲害！", "完全正確！", "繼續加油！", "你是天才！"];

    /* ==========================================
       2. 玩家個人資料儲存 (localStorage)
       ========================================== */
    const STORAGE_KEY = "balloon_v3_users";
    let usersData = JSON.parse(localStorage.getItem(STORAGE_KEY)) || {
      "小寶貝": {
        coins: 10, totalCorrect: 0,
        ownedHats: ["none"], ownedShirts: ["green"], ownedBows: ["wood"], ownedCharacters: ["archer"],
        equippedHat: "none", equippedShirt: "green", equippedBow: "wood", equippedCharacter: "archer"
      }
    };
    let currentUser = localStorage.getItem("balloon_v3_currentUser") || "小寶貝";
    if (!usersData[currentUser]) currentUser = Object.keys(usersData)[0] || "小寶貝";

    function saveData() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(usersData));
      localStorage.setItem("balloon_v3_currentUser", currentUser);
      updateUserUI();
    }

    function getUserData() {
      return usersData[currentUser];
    }

    function updateUserUI() {
      const data = getUserData();
      document.getElementById('current-user-name').innerText = currentUser;
      document.getElementById('user-stars').innerText = data.coins;
      renderAllArchers();
      renderAchievements();
    }

    /* ==========================================
       3. 音效與語音系統
       ========================================== */
    let isSoundOn = true;
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

    function playTone(kind) {
      if (!isSoundOn) return;
      try {
        const now = audioCtx.currentTime;
        const notes = kind === "correct" ? [523.25, 659.25, 783.99] : kind === "wrong" ? [220, 196] : [330, 262];
        notes.forEach((freq, i) => {
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          osc.type = kind === "wrong" ? "sawtooth" : "sine";
          osc.frequency.value = freq;
          gain.gain.setValueAtTime(0.0001, now + i * 0.1);
          gain.gain.exponentialRampToValueAtTime(0.2, now + i * 0.1 + 0.02);
          gain.gain.exponentialRampToValueAtTime(0.0001, now + i * 0.1 + 0.28);
          osc.connect(gain).connect(audioCtx.destination);
          osc.start(now + i * 0.1);
          osc.stop(now + i * 0.1 + 0.3);
        });
      } catch (e) {}
    }

    function speakText(text) {
      if (!isSoundOn || !window.speechSynthesis) return;
      try {
        window.speechSynthesis.cancel();
        const u = new SpeechSynthesisUtterance(text);
        u.lang = "zh-TW";
        u.rate = 0.85;
        u.pitch = 1.15;
        window.speechSynthesis.speak(u);
      } catch (e) {}
    }

    function toggleSound() {
      isSoundOn = !isSoundOn;
      const soundIcon = document.getElementById('soundIcon');
      if (isSoundOn) {
        soundIcon.className = "fas fa-volume-up text-2xl";
        playTone("correct");
        speakText("聲音開啟");
      } else {
        soundIcon.className = "fas fa-volume-mute text-2xl text-gray-400";
        if (window.speechSynthesis) window.speechSynthesis.cancel();
      }
    }

    /* ==========================================
       4. SVG 角色繪製
       ========================================== */
    function renderArcherSVG(hat, shirtColor, bowColor, accessory, shooting = false, size = 140) {
      const hatEmoji = HATS.find((h) => h.id === hat)?.emoji;
      const isCape = accessory === "maskWhite" || accessory === "maskFlame";
      const capeColor = accessory === "maskWhite" ? "#EDF3F5" : "#23232B";
      const capeTrim = accessory === "maskWhite" ? "#9FD3E8" : "#FF7A45";
      const maskColor = accessory === "maskWhite" ? "#F5F5F5" : "#2E2E38";
      const maskTrim = accessory === "maskWhite" ? "#B9C4CC" : "#FF7A45";

      return `
        <div style="position: relative; width: ${size}px; height: ${size * 1.1}px;">
          ${hatEmoji && accessory === "none" ? `
            <div style="position: absolute; top: -${size * 0.1}px; left: ${size * 0.4}px; font-size: ${size * 0.3}px; z-index: 4; filter: drop-shadow(0 2px 2px rgba(0,0,0,0.2)); transform: rotate(-6deg);">
              ${hatEmoji}
            </div>
          ` : ''}
          <svg viewBox="0 0 220 230" width="${size}" height="${size * 1.1}" style="position: relative; z-index: 2;">
            ${isCape ? `<path d="M78 96 Q30 140 44 206 Q80 184 96 150 Q100 190 100 150 Q120 190 140 150 Q156 184 176 206 Q192 140 142 96 Z" fill="${capeColor}" stroke="${capeTrim}" stroke-width="3" opacity="0.95"/>` : ''}
            <rect x="88" y="150" width="20" height="46" rx="9" fill="#3E4C6D" />
            <ellipse cx="98" cy="200" rx="15" ry="9" fill="#7A5230" />
            ${!isCape ? `<rect x="58" y="105" width="26" height="46" rx="10" fill="#B5762A" />` : ''}
            <ellipse cx="100" cy="128" rx="40" ry="42" fill="${shirtColor}" />
            <path d="M70 108 Q100 96 130 108 L128 122 Q100 112 72 122 Z" fill="rgba(255,255,255,0.28)" />
            ${accessory === "bull" ? `
              <rect x="60" y="98" width="20" height="14" rx="4" fill="#3A1414" />
              <rect x="120" y="98" width="20" height="14" rx="4" fill="#3A1414" />
            ` : ''}
            <rect x="114" y="156" width="20" height="42" rx="9" fill="#3E4C6D" />
            <ellipse cx="124" cy="202" rx="16" ry="9" fill="#7A5230" />
            <circle cx="72" cy="118" r="11" fill="#FFD9B0" />
            <g style="transform-origin: 168px 118px; transform: ${shooting ? 'rotate(-4deg) scale(1.03)' : 'rotate(0deg)'}; transition: transform 0.12s;">
              <path d="M168 58 Q200 118 168 178" stroke="${bowColor}" stroke-width="8" fill="none" stroke-linecap="round" />
              <line x1="168" y1="58" x2="168" y2="178" stroke="#EDE6D6" stroke-width="2" />
              <line x1="118" y1="118" x2="170" y2="118" stroke="#EDE6D6" stroke-width="2" />
              <path d="M112 118 L138 111 L138 125 Z" fill="#C9A26A" />
            </g>
            <rect x="128" y="104" width="18" height="30" rx="9" fill="#FFD9B0" transform="rotate(8 137 118)" />
            ${accessory === "monkey" ? `
              <circle cx="62" cy="66" r="13" fill="#E8C39E" />
              <circle cx="162" cy="66" r="13" fill="#E8C39E" />
            ` : ''}
            ${accessory === "bull" ? `
              <path d="M86 36 Q68 6 54 12" stroke="#F5F0E6" stroke-width="8" fill="none" stroke-linecap="round" />
              <path d="M138 36 Q156 6 170 12" stroke="#F5F0E6" stroke-width="8" fill="none" stroke-linecap="round" />
            ` : ''}
            <circle cx="112" cy="66" r="46" fill="#FFD9B0" />
            <path d="M68 58 Q78 8 130 16 Q160 22 156 58 Q140 34 112 32 Q84 32 74 54 Z" fill="#5C3A21" />
            ${accessory === "none" ? `
              <path d="M66 52 Q112 34 158 52 L156 66 Q112 50 68 66 Z" fill="#3E4C6D" />
              <path d="M66 54 Q52 62 50 78 Q60 68 70 64 Z" fill="#3E4C6D" />
            ` : ''}
            ${accessory === "monkey" ? `
              <path d="M64 52 Q112 32 160 52 L158 64 Q112 48 66 64 Z" fill="#FFC94A" stroke="#B5762A" stroke-width="1.5" />
              <circle cx="112" cy="50" r="6" fill="#E63946" />
            ` : ''}
            ${accessory === "bull" ? `<path d="M78 78 Q112 88 146 78" stroke="#3A1414" stroke-width="4" fill="none" stroke-linecap="round" />` : ''}
            ${isCape ? `<path d="M70 56 Q64 88 74 108 Q80 92 90 78 Z" fill="${accessory === 'maskWhite' ? '#DCE6EA' : '#1B1B22'}" opacity="0.9" />` : ''}
            <ellipse cx="94" cy="80" rx="8" ry="5" fill="#FFB1A6" opacity="0.7" />
            <ellipse cx="132" cy="80" rx="8" ry="5" fill="#FFB1A6" opacity="0.7" />
            <circle cx="100" cy="70" r="8" fill="#3E2A1A" />
            <circle cx="103" cy="67" r="2.6" fill="#fff" />
            <circle cx="128" cy="70" r="8" fill="#3E2A1A" />
            <circle cx="131" cy="67" r="2.6" fill="#fff" />
            ${isCape ? `<path d="M78 84 Q112 100 146 84 L146 98 Q112 114 78 98 Z" fill="${maskColor}" stroke="${maskTrim}" stroke-width="2" />` : `<path d="M104 90 Q114 98 124 90" stroke="#B5674A" stroke-width="3" fill="none" stroke-linecap="round" />`}
          </svg>
        </div>
      `;
    }

    function renderAllArchers() {
      const data = getUserData();
      const activeChar = CHARACTERS.find((c) => c.id === data.equippedCharacter) || CHARACTERS[0];
      const isDefault = activeChar.id === "archer";

      const shirtColor = isDefault ? SHIRTS.find((s) => s.id === data.equippedShirt)?.color || "#5FB86B" : activeChar.shirtColor;
      const bowColor = isDefault ? BOWS.find((b) => b.id === data.equippedBow)?.color || "#8B5A2B" : activeChar.bowColor;
      const hatId = isDefault ? data.equippedHat : "none";

      const html = renderArcherSVG(hatId, shirtColor, bowColor, activeChar.accessory, false, 150);
      document.getElementById('home-archer-container').innerHTML = html;
      document.getElementById('game-archer-container').innerHTML = renderArcherSVG(hatId, shirtColor, bowColor, activeChar.accessory, false, 130);
      document.getElementById('shop-preview-container').innerHTML = html;

      document.getElementById('home-character-name').innerText = activeChar.name;
      document.getElementById('shop-preview-name').innerText = activeChar.name;
    }

    function renderAchievements() {
      const data = getUserData();
      const container = document.getElementById('home-achievements');
      container.innerHTML = '';
      ACHIEVEMENTS.forEach(a => {
        const unlocked = data.totalCorrect >= a.min;
        const div = document.createElement('div');
        div.className = `w-10 h-10 rounded-full flex items-center justify-center text-xl shadow-md ${unlocked ? 'bg-amber-100' : 'bg-gray-200 opacity-40 grayscale'}`;
        div.title = a.name;
        div.innerText = a.icon;
        container.appendChild(div);
      });
    }

    /* ==========================================
       5. 氣球升起與遊戲核心邏輯
       ========================================== */
    let currentMode = 10;
    let targetNumber = 1;
    let roundIndex = 0;
    const roundTotal = 8;
    let roundStars = 0;
    let combo = 0;
    let activeBalloons = [];
    let spawnTimer = null;
    let balloonIdCounter = 0;

    function startRound(mode) {
      currentMode = mode;
      roundIndex = 0;
      roundStars = 0;
      combo = 0;
      clearBalloons();

      document.getElementById('screen-home').classList.add('hidden');
      document.getElementById('screen-result').classList.add('hidden');
      document.getElementById('screen-game').classList.remove('hidden');

      nextQuestion();

      if (spawnTimer) clearInterval(spawnTimer);
      // 定時生成新氣球
      spawnTimer = setInterval(() => {
        const alive = activeBalloons.filter(b => b.state === 'normal');
        if (alive.length >= (currentMode <= 10 ? 4 : 5)) return;
        const hasTarget = alive.some(b => b.value === targetNumber);
        spawnBalloon(!hasTarget && Math.random() < 0.6);
      }, 1500);

      // 第一批氣球
      spawnBalloon(true);
      setTimeout(() => spawnBalloon(false), 600);
      setTimeout(() => spawnBalloon(false), 1200);
    }

    function nextQuestion() {
      targetNumber = Math.floor(Math.random() * currentMode) + 1;
      document.getElementById('target-number-text').innerText = targetNumber;
      updateProgressDots();
      speakTarget();
    }

    function speakTarget() {
      speakText(`聽一聽，請射破數字 ${numberToChinese(targetNumber)} 的氣球！`);
    }

    function updateProgressDots() {
      const container = document.getElementById('progress-dots');
      container.innerHTML = '';
      for (let i = 0; i < roundTotal; i++) {
        const dot = document.createElement('div');
        dot.className = `w-3 h-3 rounded-full ${i < roundIndex ? 'bg-amber-400' : i === roundIndex ? 'bg-amber-500 scale-125' : 'bg-white/60'}`;
        container.appendChild(dot);
      }
    }

    function spawnBalloon(forceTarget) {
      const area = document.getElementById('balloon-area');
      if (!area) return;

      let val;
      if (forceTarget) val = targetNumber;
      else {
        val = Math.floor(Math.random() * currentMode) + 1;
      }

      const id = balloonIdCounter++;
      // 隨機 X 軸定位 (15% ~ 80%)
      const xPos = Math.floor(Math.random() * 65) + 15;
      const duration = (currentMode <= 10 ? 6.5 : 5.2) + Math.random() * 2;
      const color = BALLOON_COLORS[Math.floor(Math.random() * BALLOON_COLORS.length)];

      const wrapper = document.createElement('div');
      wrapper.className = 'balloon-wrapper balloon-rising';
      wrapper.style.left = xPos + '%';
      wrapper.style.setProperty('--rise-duration', `${duration}s`);

      wrapper.innerHTML = `
        <div class="balloon-sway">
          <div class="balloon-body" style="background: radial-gradient(circle at 32% 28%, rgba(255,255,255,0.85), ${color} 55%);">
            <span class="text-4xl sm:text-5xl font-black text-white drop-shadow-md">${val}</span>
          </div>
          <div class="balloon-string"></div>
        </div>
      `;

      wrapper.onclick = (e) => handleBalloonClick(id, val, wrapper, e);

      area.appendChild(wrapper);
      activeBalloons.push({ id, value: val, element: wrapper, state: 'normal' });

      // 當氣球完全升過畫面頂端時移除
      wrapper.addEventListener('animationend', (e) => {
        if (e.animationName === 'riseUp') {
          wrapper.remove();
          activeBalloons = activeBalloons.filter(b => b.id !== id);
        }
      });
    }

    function handleBalloonClick(id, val, element, event) {
      const bObj = activeBalloons.find(b => b.id === id);
      if (!bObj || bObj.state !== 'normal') return;

      const rect = element.getBoundingClientRect();
      const x = rect.left + rect.width / 2;
      const y = rect.top;

      if (val === targetNumber) {
        // 答對，射破氣球
        bObj.state = 'correct';
        playTone('correct');
        createParticles(x, y, '⭐');

        element.classList.add('balloon-pop');

        combo++;
        const bonus = combo > 0 && combo % 3 === 0 ? 2 : 0;
        const earn = 1 + bonus;
        roundStars += earn;

        const data = getUserData();
        data.coins += earn;
        data.totalCorrect += 1;
        saveData();

        showToast(CHEERS[Math.floor(Math.random() * CHEERS.length)] + (bonus ? " 連擊獎勵 +2⭐" : ""));

        setTimeout(() => {
          element.remove();
          activeBalloons = activeBalloons.filter(b => b.id !== id);
        }, 400);

        roundIndex++;
        if (roundIndex >= roundTotal) {
          setTimeout(endRound, 800);
        } else {
          setTimeout(nextQuestion, 700);
        }

      } else {
        // 答錯，震動提示
        bObj.state = 'wrong';
        playTone('wrong');
        combo = 0;
        createParticles(x, y, '💦');

        element.classList.add('balloon-shake');
        setTimeout(() => {
          element.classList.remove('balloon-shake');
          bObj.state = 'normal';
        }, 450);
      }
    }

    function clearBalloons() {
      if (spawnTimer) clearInterval(spawnTimer);
      document.getElementById('balloon-area').innerHTML = '';
      activeBalloons = [];
    }

    function endRound() {
      clearBalloons();
      document.getElementById('screen-game').classList.add('hidden');
      document.getElementById('screen-result').classList.remove('hidden');
      document.getElementById('result-stars-count').innerText = roundStars;
      speakText(`恭喜通關！獲得 ${roundStars} 顆星星！`);
    }

    function replayCurrentRound() {
      startRound(currentMode);
    }

    function goHome() {
      clearBalloons();
      document.getElementById('screen-game').classList.add('hidden');
      document.getElementById('screen-result').classList.add('hidden');
      document.getElementById('screen-home').classList.remove('hidden');
      updateUserUI();
    }

    /* ==========================================
       6. 造型商店管理 Modal
       ========================================== */
    let currentShopTab = 'character';

    function openShop() {
      setShopTab('character');
      document.getElementById('shopModal').classList.remove('hidden');
      speakText('歡迎來到造型商店');
    }

    function closeShop() {
      document.getElementById('shopModal').classList.add('hidden');
      updateUserUI();
    }

    function setShopTab(tab) {
      currentShopTab = tab;
      ['character', 'hat', 'shirt', 'bow'].forEach(t => {
        const btn = document.getElementById(`tab-btn-${t}`);
        if (t === tab) {
          btn.className = "btn-cute px-4 py-2 rounded-xl font-black text-lg bg-amber-400 text-white";
        } else {
          btn.className = "btn-cute px-4 py-2 rounded-xl font-black text-lg bg-white text-amber-900";
        }
      });
      renderShopItems();
    }

    function renderShopItems() {
      const grid = document.getElementById('shop-items-grid');
      grid.innerHTML = '';
      const data = getUserData();

      if (currentShopTab === 'character') {
        CHARACTERS.forEach(c => {
          const owned = data.ownedCharacters.includes(c.id);
          const equipped = data.equippedCharacter === c.id;
          const card = document.createElement('div');
          card.className = `bg-white rounded-2xl p-3 border-4 ${equipped ? 'border-emerald-400' : 'border-amber-200'} flex flex-col items-center justify-between shadow-md cursor-pointer`;
          card.onclick = () => buyOrEquip('character', c);

          card.innerHTML = `
            <div class="transform scale-75 h-20 flex justify-center items-center">
              ${renderArcherSVG("none", c.shirtColor, c.bowColor, c.accessory, false, 110)}
            </div>
            <div class="font-black text-amber-900 text-base">${c.badge} ${c.name}</div>
            <div class="mt-1 font-black text-sm">
              ${equipped ? '<span class="text-emerald-600">✓ 使用中</span>' :
                owned ? '<span class="text-sky-500">點擊裝備</span>' :
                `<span class="text-amber-600">⭐ ${c.price}</span>`}
            </div>
          `;
          grid.appendChild(card);
        });
      } else {
        const items = currentShopTab === 'hat' ? HATS : currentShopTab === 'shirt' ? SHIRTS : BOWS;
        const keyMap = { hat: 'ownedHats', shirt: 'ownedShirts', bow: 'ownedBows' };
        const eqMap = { hat: 'equippedHat', shirt: 'equippedShirt', bow: 'equippedBow' };

        items.forEach(item => {
          const owned = data[keyMap[currentShopTab]].includes(item.id);
          const equipped = data[eqMap[currentShopTab]] === item.id;

          const card = document.createElement('div');
          card.className = `bg-white rounded-2xl p-3 border-4 ${equipped ? 'border-emerald-400' : 'border-amber-200'} flex flex-col items-center justify-between shadow-md cursor-pointer`;
          card.onclick = () => buyOrEquip(currentShopTab, item);

          card.innerHTML = `
            <div class="h-12 flex items-center justify-center text-3xl">
              ${currentShopTab === 'hat' ? (item.emoji || '🚫') :
                `<div class="w-8 h-8 rounded-full border-2 border-gray-300" style="background: ${item.color}"></div>`}
            </div>
            <div class="font-black text-amber-900 text-base">${item.name}</div>
            <div class="mt-1 font-black text-sm">
              ${equipped ? '<span class="text-emerald-600">✓ 使用中</span>' :
                owned ? '<span class="text-sky-500">點擊裝備</span>' :
                `<span class="text-amber-600">⭐ ${item.price}</span>`}
            </div>
          `;
          grid.appendChild(card);
        });
      }
    }

    function buyOrEquip(type, item) {
      const data = getUserData();
      if (type === 'character') {
        if (data.ownedCharacters.includes(item.id)) {
          data.equippedCharacter = item.id;
          saveData();
          renderShopItems();
          showToast(`已裝備：${item.name}`);
        } else if (data.coins >= item.price) {
          data.coins -= item.price;
          data.ownedCharacters.push(item.id);
          data.equippedCharacter = item.id;
          saveData();
          renderShopItems();
          showToast(`獲得新品：${item.name}`);
        } else {
          showToast("星星金幣不夠喔！");
        }
      } else {
        const keyMap = { hat: 'ownedHats', shirt: 'ownedShirts', bow: 'ownedBows' };
        const eqMap = { hat: 'equippedHat', shirt: 'equippedShirt', bow: 'equippedBow' };

        if (data[keyMap[type]].includes(item.id)) {
          data[eqMap[type]] = item.id;
          data.equippedCharacter = 'archer';
          saveData();
          renderShopItems();
          showToast(`已裝備：${item.name}`);
        } else if (data.coins >= item.price) {
          data.coins -= item.price;
          data[keyMap[type]].push(item.id);
          data[eqMap[type]] = item.id;
          data.equippedCharacter = 'archer';
          saveData();
          renderShopItems();
          showToast(`獲得新品：${item.name}`);
        } else {
          showToast("星星金幣不夠喔！");
        }
      }
    }

    /* ==========================================
       7. 多人帳號管理 Modal
       ========================================== */
    function openUserModal() {
      renderUserList();
      document.getElementById('userModal').classList.remove('hidden');
    }

    function closeUserModal() {
      document.getElementById('userModal').classList.add('hidden');
    }

    function renderUserList() {
      const container = document.getElementById('user-list');
      container.innerHTML = '';
      Object.keys(usersData).forEach(name => {
        const isCurrent = name === currentUser;
        const btn = document.createElement('button');
        btn.className = `btn-cute p-3 rounded-2xl font-black text-xl flex items-center justify-between border-2 ${isCurrent ? 'bg-amber-400 text-white border-amber-300' : 'bg-gray-100 text-gray-700 border-gray-300'}`;
        btn.innerHTML = `
          <span>👤 ${name}</span>
          <span class="text-amber-600 bg-white px-3 py-1 rounded-xl text-base">⭐ ${usersData[name].coins}</span>
        `;
        btn.onclick = () => {
          currentUser = name;
          saveData();
          closeUserModal();
          speakText(`你好，${currentUser}`);
        };
        container.appendChild(btn);
      });
    }

    function addNewUser() {
      const input = document.getElementById('new-username-input');
      const name = input.value.trim();
      if (!name) return;

      if (Object.keys(usersData).length >= 5) {
        showToast("最多只支援 5 位玩家喔");
        return;
      }

      if (!usersData[name]) {
        usersData[name] = {
          coins: 10, totalCorrect: 0,
          ownedHats: ["none"], ownedShirts: ["green"], ownedBows: ["wood"], ownedCharacters: ["archer"],
          equippedHat: "none", equippedShirt: "green", equippedBow: "wood", equippedCharacter: "archer"
        };
        currentUser = name;
        saveData();
        input.value = '';
        closeUserModal();
        speakText(`歡迎新朋友 ${name}`);
      }
    }

    /* ==========================================
       8. 特效與提示
       ========================================== */
    function showToast(msg) {
      const toast = document.getElementById('toast-el');
      toast.innerText = msg;
      toast.classList.remove('hidden');
      setTimeout(() => toast.classList.add('hidden'), 1600);
    }

    function createParticles(x, y, icon) {
      for (let i = 0; i < 5; i++) {
        const p = document.createElement('div');
        p.className = 'particle text-4xl';
        p.innerText = icon;
        p.style.left = (x + (Math.random() * 60 - 30)) + 'px';
        p.style.top = y + 'px';
        document.body.appendChild(p);
        setTimeout(() => p.remove(), 900);
      }
    }

    // 初始化
    window.onload = () => {
      saveData();
      updateUserUI();
    };
  </script>
</body>
