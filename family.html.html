<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>家人小教室</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=ZCOOL+KuaiLe&family=Baloo+2:wght@500;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --cream:#F1EAE0; --cream-deep:#E4DACB; --ink:#5A4B3F; --white:#FFFBF5;
    --clay:#C97B63; --gold:#D9B65E; --sage:#8FA888; --blue:#7F9BB0; --purple:#A48CA6; --pink:#D3A0A8;
    --shadow: 0 6px 0 rgba(90,75,63,0.18);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent; user-select:none;}
  html,body{height:100%; margin:0; overflow:hidden;}
  body{font-family:'ZCOOL KuaiLe','Baloo 2',sans-serif; background:var(--cream); color:var(--ink);}
  #app{height:100vh; height:100dvh; width:100vw; position:relative; overflow:hidden;}
  .screen{position:absolute; inset:0; display:none; flex-direction:column; height:100%; width:100%;}
  .screen.active{display:flex;}
  h1,h2{margin:0;}
  button{font-family:inherit;}

  /* ---------- SETUP SCREEN ---------- */
  #screen-setup{padding:clamp(14px,3vh,26px) clamp(14px,4vw,30px); overflow-y:auto;}
  .setup-header{text-align:center; margin-bottom:12px; flex-shrink:0;}
  .setup-header h1{font-size:clamp(26px,6vw,44px); color:var(--clay); text-shadow:2px 3px 0 rgba(0,0,0,0.08);}
  .setup-header p{font-size:clamp(13px,2.6vw,17px); opacity:0.75; margin:6px 0 0;}
  .privacy-note{
    background:var(--white); border-radius:14px; padding:8px 14px; margin:10px auto 0;
    font-size:clamp(11px,2.3vw,14px); max-width:560px; text-align:center; box-shadow:var(--shadow); color:var(--ink);
  }
  .topic-bar{
    display:flex; gap:8px; flex-wrap:wrap; justify-content:center;
    max-width:900px; margin:14px auto 0; width:100%;
  }
  .topic-chip{
    border:none; border-radius:999px; padding:8px 16px; font-family:inherit;
    font-size:clamp(13px,2.8vw,16px); font-weight:700; cursor:pointer;
    background:var(--white); color:var(--ink); box-shadow:var(--shadow);
    display:flex; align-items:center; gap:6px;
  }
  .topic-chip.active{background:var(--sage); color:#fff;}
  .topic-chip:active{transform:translateY(3px); box-shadow:none;}
  .topic-chip .topic-del{
    opacity:0.7; font-size:12px; width:16px; height:16px; display:inline-flex;
    align-items:center; justify-content:center; border-radius:50%; background:rgba(0,0,0,0.12);
  }
  .topic-chip.topic-add{background:var(--purple); color:#fff;}
  .slot-grid{
    display:grid; grid-template-columns:repeat(auto-fill, minmax(120px,1fr)); gap:14px;
    max-width:900px; margin:16px auto; width:100%;
  }
  .slot-card{
    background:var(--white); border-radius:20px; padding:12px; box-shadow:var(--shadow);
    display:flex; flex-direction:column; align-items:center; gap:8px; position:relative;
  }
  .photo-circle{
    width:clamp(64px,18vw,92px); aspect-ratio:1/1; border-radius:50%; background:var(--cream-deep);
    display:flex; align-items:center; justify-content:center; overflow:hidden; border:3px dashed #cbb9a4;
    font-size:clamp(26px,7vw,36px); cursor:grab; flex-shrink:0; touch-action:none;
  }
  .photo-circle:active{cursor:grabbing;}
  .photo-circle img{width:100%; height:100%; object-fit:cover; pointer-events:none;}
  .drag-hint{font-size:clamp(9px,2vw,11px); color:var(--ink); opacity:0.55; margin-top:-4px;}
  .preview-voice-btn{
    flex-shrink:0; border:none; background:var(--gold); color:#fff; border-radius:10px;
    width:34px; font-size:15px; cursor:pointer;
  }
  .preview-voice-btn:active{transform:translateY(2px);}
  .upload-btn{
    font-size:clamp(11px,2.3vw,13px); background:var(--sage); color:var(--white); border:none;
    border-radius:999px; padding:4px 12px; cursor:pointer; font-weight:700;
  }
  .label-input{
    width:100%; text-align:center; border:2px solid var(--cream-deep); border-radius:10px;
    padding:5px 4px; font-family:inherit; font-size:clamp(13px,2.8vw,16px); background:var(--cream);
    color:var(--ink);
  }
  .remove-btn{
    position:absolute; top:2px; right:2px; width:24px; height:24px; border-radius:50%;
    background:var(--clay); color:#fff; border:none; font-size:14px; cursor:pointer; line-height:1;
  }
  .add-slot{
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:6px;
    background:var(--cream-deep); border:3px dashed #cbb9a4; border-radius:20px; min-height:140px;
    cursor:pointer; color:var(--ink); font-size:clamp(13px,2.8vw,16px); font-weight:700;
  }
  .add-slot .plus{font-size:clamp(28px,7vw,40px);}
  .setup-footer{
    position:sticky; bottom:0; display:flex; gap:10px; justify-content:center; flex-wrap:wrap;
    padding:14px 0 4px; background:linear-gradient(transparent, var(--cream) 40%);
  }
  .big-btn{
    border:none; border-radius:999px; padding:14px 26px; font-size:clamp(16px,3.6vw,22px);
    font-weight:700; color:var(--white); box-shadow:var(--shadow); cursor:pointer;
  }
  .big-btn:active{transform:translateY(4px); box-shadow:none;}
  .btn-learn{background:var(--blue);}
  .btn-quiz{background:var(--clay);}
  .btn-match{background:var(--purple);}
  .setup-hint{font-size:clamp(12px,2.4vw,15px); color:var(--ink); opacity:0.7; text-align:center; margin-top:4px;}

  /* ---------- shared top bar ---------- */
  .top-bar{
    flex-shrink:0; display:flex; align-items:center; justify-content:space-between;
    padding:clamp(8px,2vh,14px) clamp(12px,3vw,22px);
  }
  .btn-back{
    border:none; background:var(--white); border-radius:999px; padding:8px 16px;
    font-size:clamp(14px,2.8vw,18px); font-weight:700; box-shadow:var(--shadow); cursor:pointer; color:var(--ink);
  }
  .btn-back:active{transform:translateY(4px); box-shadow:none;}
  .top-title{font-size:clamp(16px,3.6vw,24px); font-weight:700; text-align:center; flex:1;}

  /* ---------- LEARN MODE ---------- */
  #screen-learn{background:linear-gradient(#F1EAE0,#E7DCCB);}
  .learn-grid{
    flex:1; min-height:0; overflow-y:auto;
    display:grid; grid-template-columns:repeat(auto-fill, minmax(130px,1fr)); gap:16px;
    padding:8px clamp(14px,3vw,26px) 24px;
  }
  .learn-card{
    background:var(--white); border-radius:24px; padding:14px 10px; box-shadow:var(--shadow);
    display:flex; flex-direction:column; align-items:center; gap:8px; cursor:pointer;
    transition:transform .15s;
  }
  .learn-card.bounce{transform:scale(1.12);}
  .learn-photo{width:100%; aspect-ratio:1/1; border-radius:50%; overflow:hidden; background:var(--cream-deep);}
  .learn-photo img{width:100%; height:100%; object-fit:cover;}
  .learn-name{font-size:clamp(16px,3.6vw,22px); font-weight:700; color:var(--ink);}

  /* ---------- QUIZ MODE ---------- */
  #screen-quiz{background:linear-gradient(#F3E6DE,#E8D2C4);}
  .quiz-question{
    flex-shrink:0; text-align:center; padding:6px clamp(14px,4vw,26px) 4px;
  }
  .quiz-question .q-text{font-size:clamp(20px,5vw,32px); font-weight:700; color:var(--clay);}
  .replay-btn{
    margin-top:8px; border:none; background:var(--white); border-radius:999px; padding:8px 18px;
    font-size:clamp(14px,3vw,18px); font-weight:700; box-shadow:var(--shadow); cursor:pointer; color:var(--ink);
  }
  .replay-btn:active{transform:translateY(3px); box-shadow:none;}
  .quiz-grid{
    flex:1; min-height:0; display:grid; gap:16px; padding:10px clamp(14px,4vw,26px) 20px;
    align-content:center; justify-content:center;
  }
  .quiz-card{
    background:var(--white); border-radius:26px; padding:14px; box-shadow:var(--shadow);
    display:flex; flex-direction:column; align-items:center; gap:8px; cursor:pointer;
    width:clamp(120px,26vw,220px); transition: transform .15s;
  }
  .quiz-card.shake{animation: shake .4s;}
  .quiz-card.correctFlash{background:#DCEAD4;}
  @keyframes shake{
    0%,100%{transform:translateX(0);} 20%{transform:translateX(-8px);} 40%{transform:translateX(8px);}
    60%{transform:translateX(-6px);} 80%{transform:translateX(6px);}
  }
  .quiz-photo{width:100%; aspect-ratio:1/1; border-radius:50%; overflow:hidden; background:var(--cream-deep);}
  .quiz-photo img{width:100%; height:100%; object-fit:cover;}
  .quiz-name{font-size:clamp(15px,3.2vw,19px); font-weight:700; color:var(--ink); opacity:0; height:0;}
  .quiz-footer{flex-shrink:0; display:flex; justify-content:center; gap:10px; padding:0 0 14px;}
  .stat-pill{
    background:var(--white); border-radius:999px; padding:6px 16px; font-size:clamp(14px,3vw,18px);
    font-weight:700; box-shadow:var(--shadow);
  }
  .praise{
    position:absolute; z-index:20; font-size:clamp(20px,5vw,32px); font-weight:800; color:var(--clay);
    left:50%; top:38%; transform:translate(-50%,0); pointer-events:none; text-shadow:1px 1px 0 #fff;
    animation: floatUp .9s ease-out forwards;
  }
  @keyframes floatUp{
    0%{opacity:0; transform:translate(-50%,10px) scale(0.6);}
    30%{opacity:1; transform:translate(-50%,-10px) scale(1.2);}
    100%{opacity:0; transform:translate(-50%,-60px) scale(1);}
  }

  .mute-btn{
    width:clamp(40px,8vw,52px); height:clamp(40px,8vw,52px); border-radius:50%; border:none;
    background:var(--white); box-shadow:var(--shadow); font-size:clamp(18px,4vw,24px); cursor:pointer;
    display:flex; align-items:center; justify-content:center;
  }
  .mute-btn:active{transform:translateY(3px); box-shadow:none;}

  /* ---------- MATCH MODE ---------- */
  #screen-match{background:linear-gradient(#EEE6F1,#DCD0E6);}
  .match-grid{
    flex:1; min-height:0; overflow-y:auto;
    display:grid; gap:clamp(8px,2vw,14px); padding:8px clamp(14px,3vw,24px) 20px;
    align-content:center;
  }
  .match-card{ aspect-ratio:1/1; perspective:700px; cursor:pointer; }
  .match-card-inner{
    position:relative; width:100%; height:100%; transition: transform .4s;
    transform-style:preserve-3d;
  }
  .match-card.flipped .match-card-inner, .match-card.matched .match-card-inner{ transform: rotateY(180deg); }
  .match-face{
    position:absolute; inset:0; backface-visibility:hidden; border-radius:18px;
    display:flex; align-items:center; justify-content:center; overflow:hidden; box-shadow:var(--shadow);
  }
  .match-back{
    background: repeating-linear-gradient(45deg, var(--purple), var(--purple) 10px, #B79FBB 10px, #B79FBB 20px);
    color:#fff; font-size:clamp(20px,6vw,32px); font-weight:800;
  }
  .match-front{ transform: rotateY(180deg); background:var(--white); }
  .match-front img{width:100%; height:100%; object-fit:cover;}
  .match-card.matched .match-face{ box-shadow:0 0 0 4px var(--sage), var(--shadow); }
  .match-complete{
    position:absolute; inset:0; display:none; align-items:center; justify-content:center;
    background:rgba(241,234,224,0.94); z-index:30;
  }
  .match-complete-card{ background:var(--white); border-radius:28px; padding:clamp(22px,5vw,36px) clamp(24px,7vw,44px); text-align:center; box-shadow:var(--shadow); max-width:88vw;}
  .match-complete-card h2{ color:var(--clay); font-size:clamp(22px,5.5vw,32px); margin-bottom:10px;}
  .match-complete-card p{ font-size:clamp(15px,3.4vw,20px); margin:0 0 16px; color:var(--ink);}
  .mc-btn{
    border:none; color:#fff; font-weight:700; font-size:clamp(15px,3.4vw,19px);
    border-radius:999px; padding:11px 20px; cursor:pointer; box-shadow:var(--shadow);
  }
  .mc-btn:active{transform:translateY(4px); box-shadow:none;}
</style>
</head>
<body>
<div id="app">

  <!-- ============ 設定畫面 ============ -->
  <div id="screen-setup" class="screen active">
    <div class="setup-header">
      <h1>👨‍👩‍👧‍👦 家人小教室</h1>
      <p>放上照片，還可以自己新增想教的主題（不只是家人喔）！</p>
      <div class="privacy-note">🔒 所有照片只會在您的瀏覽器裡處理，不會上傳到任何伺服器。</div>
    </div>
    <div class="topic-bar" id="topicBar"></div>
    <div class="slot-grid" id="slotGrid"></div>
    <div style="text-align:center;">
      <div class="add-slot" id="addSlotBtn" style="max-width:160px; margin:0 auto;">
        <span class="plus">＋</span><span>新增家人</span>
      </div>
    </div>
    <div class="setup-footer">
      <button class="big-btn btn-learn" id="btnGoLearn">🖐️ 點點認識我</button>
      <button class="big-btn btn-quiz" id="btnGoQuiz">🎧 聽聽找找看</button>
      <button class="big-btn btn-match" id="btnGoMatch">🧩 記憶配對</button>
    </div>
    <div class="setup-hint" id="setupHint"></div>
  </div>

  <!-- ============ 學習模式 ============ -->
  <div id="screen-learn" class="screen">
    <div class="top-bar">
      <button class="btn-back" id="btnBackLearn">← 返回</button>
      <div class="top-title" id="learnTopTitle">🖐️ 點點認識我</div>
      <button class="mute-btn" id="muteLearn">🔊</button>
    </div>
    <div class="learn-grid" id="learnGrid"></div>
  </div>

  <!-- ============ 問答模式 ============ -->
  <div id="screen-quiz" class="screen">
    <div class="top-bar">
      <button class="btn-back" id="btnBackQuiz">← 返回</button>
      <div class="top-title" id="quizTopTitle">🎧 聽聽找找看</div>
      <button class="mute-btn" id="muteQuiz">🔊</button>
    </div>
    <div class="quiz-question">
      <div class="q-text" id="quizQuestionText">準備好了嗎？</div>
      <button class="replay-btn" id="replayBtn">🔁 再聽一次</button>
    </div>
    <div class="quiz-grid" id="quizGrid"></div>
    <div class="quiz-footer">
      <div class="stat-pill">⭐ <span id="quizScore">0</span></div>
      <div class="stat-pill">第 <span id="quizRound">1</span> 題</div>
    </div>
  </div>

  <!-- ============ 記憶配對模式 ============ -->
  <div id="screen-match" class="screen">
    <div class="top-bar">
      <button class="btn-back" id="btnBackMatch">← 返回</button>
      <div class="top-title" id="matchTopTitle">🧩 記憶配對</div>
      <button class="mute-btn" id="muteMatch">🔊</button>
    </div>
    <div class="quiz-footer" style="padding-top:0;">
      <div class="stat-pill">🔄 <span id="matchMoves">0</span> 次</div>
      <div class="stat-pill">✅ <span id="matchFound">0</span>/<span id="matchTotal">0</span></div>
    </div>
    <div class="match-grid" id="matchGrid"></div>
    <div class="match-complete" id="matchComplete">
      <div class="match-complete-card">
        <h2>🎉 全部配對成功！</h2>
        <p id="matchCompleteText"></p>
        <div class="result-buttons">
          <button id="btnMatchReplay" class="mc-btn" style="background:var(--clay);">🔁 再玩一次</button>
          <button id="btnMatchMenu" class="mc-btn" style="background:var(--blue);">🏠 回設定</button>
        </div>
      </div>
    </div>
  </div>

</div>

const DEFAULT_PEOPLE = [
  {label:'爸爸', photo: IMG_DAD},
  {label:'漂亮阿姨、漂亮姑姑', photo: IMG_AUNT},
  {label:'阿公', photo: IMG_GRANDPA},
  {label:'帥哥', photo: IMG_HOTGUY},
  {label:'小哥哥', photo: IMG_BOY},
  {label:'媽媽、姑姑', photo: IMG_MOM},
  {label:'阿嬤', photo: IMG_GRANDMA},
  {label:'大哥哥', photo: IMG_BIGBRO},
];
let topics = [{id:'t0', name:'家人', people: []}];
let currentTopicId = 't0';
let topicIdCounter = 1;
let people = topics[0].people; // 指向目前選中主題的人物陣列
let muted = false;
let idCounter = 0;

function getCurrentTopic(){ return topics.find(t=>t.id===currentTopicId); }

function renderTopicBar(){
  const bar = document.getElementById('topicBar');
  bar.innerHTML = '';
  topics.forEach(topic=>{
    const chip = document.createElement('button');
    chip.className = 'topic-chip' + (topic.id===currentTopicId ? ' active' : '');
    chip.innerHTML = `<span>${topic.name}</span>` + (topics.length>1 ? `<span class="topic-del" data-id="${topic.id}">✕</span>` : '');
    chip.addEventListener('click', (e)=>{
      if(e.target.classList.contains('topic-del')){
        e.stopPropagation();
        deleteTopic(topic.id);
        return;
      }
      switchTopic(topic.id);
    });
    bar.appendChild(chip);
  });
  const addBtn = document.createElement('button');
  addBtn.className = 'topic-chip topic-add';
  addBtn.textContent = '＋ 新增主題';
  addBtn.addEventListener('click', addTopic);
  bar.appendChild(addBtn);
}

function switchTopic(id){
  if(id === currentTopicId) return;
  currentTopicId = id;
  people = getCurrentTopic().people;
  renderSlots();
  renderTopicBar();
  document.getElementById('setupHint').textContent = '';
}

function addTopic(){
  const name = prompt('請輸入新主題名稱，例如：水果、動物、交通工具、身體部位……');
  if(!name || !name.trim()) return;
  const id = 't'+(topicIdCounter++);
  topics.push({id, name:name.trim(), people:[]});
  switchTopic(id);
}

function deleteTopic(id){
  if(topics.length <= 1) return;
  const removingCurrent = (id === currentTopicId);
  topics = topics.filter(t=>t.id!==id);
  if(removingCurrent){
    switchTopic(topics[0].id);
  } else {
    renderTopicBar();
  }
}

/* ---------------- 設定畫面 ---------------- */
const slotGrid = document.getElementById('slotGrid');

function addSlot(label, photo){
  const id = 'p'+(idCounter++);
  people.push({id, label: label||'', photo: photo||null, posX:50, posY:42});
  renderSlots();
}

function renderSlots(){
  slotGrid.innerHTML='';
  people.forEach(person=>{
    const posStyle = `object-position:${person.posX}% ${person.posY}%;`;
    const card = document.createElement('div');
    card.className='slot-card';
    card.innerHTML = `
      <button class="remove-btn" data-id="${person.id}">✕</button>
      <div class="photo-circle" data-id="${person.id}">${person.photo ? `<img src="${person.photo}" style="${posStyle}">` : '👤'}</div>
      ${person.photo ? '<div class="drag-hint">👆 拖曳照片可調整位置</div>' : ''}
      <input type="file" accept="image/*" style="display:none" class="fileInput" data-id="${person.id}">
      <button class="upload-btn" data-id="${person.id}">上傳照片</button>
      <div style="display:flex; gap:4px; width:100%;">
        <input type="text" class="label-input" value="${person.label}" placeholder="輸入稱呼" data-id="${person.id}">
        <button class="preview-voice-btn" data-id="${person.id}" title="試聽語音">🔊</button>
      </div>
    `;
    slotGrid.appendChild(card);
  });

  slotGrid.querySelectorAll('.remove-btn').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const idx = people.findIndex(p=>p.id===btn.dataset.id);
      if(idx > -1) people.splice(idx, 1);
      renderSlots();
    });
  });
  slotGrid.querySelectorAll('.upload-btn').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      slotGrid.querySelector(`.fileInput[data-id="${btn.dataset.id}"]`).click();
    });
  });
  slotGrid.querySelectorAll('.photo-circle').forEach(circle=>{
    circle.addEventListener('click', (e)=>{
      // 拖曳過程中放開不要觸發重新選照片
      if(circle.dataset.dragged === '1'){ circle.dataset.dragged = '0'; return; }
      slotGrid.querySelector(`.fileInput[data-id="${circle.dataset.id}"]`).click();
    });
    enableDrag(circle);
  });
  slotGrid.querySelectorAll('.fileInput').forEach(inp=>{
    inp.addEventListener('change', (e)=>{
      const file = e.target.files[0];
      if(!file) return;
      const reader = new FileReader();
      reader.onload = (ev)=>{
        const person = people.find(p=>p.id===inp.dataset.id);
        if(person){ person.photo = ev.target.result; person.posX=50; person.posY=42; renderSlots(); }
      };
      reader.readAsDataURL(file);
    });
  });
  slotGrid.querySelectorAll('.label-input').forEach(inp=>{
    inp.addEventListener('input', ()=>{
      const person = people.find(p=>p.id===inp.dataset.id);
      if(person) person.label = inp.value;
    });
  });
  slotGrid.querySelectorAll('.preview-voice-btn').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      getCtx();
      const person = people.find(p=>p.id===btn.dataset.id);
      if(person && person.label.trim()) speak(person.label);
    });
  });
}

// 讓照片可以在圓框內拖曳，調整人物在圓形頭像裡的位置
function enableDrag(circle){
  const img = circle.querySelector('img');
  if(!img) return;
  let dragging = false;
  let startX=0, startY=0, startPosX=50, startPosY=42;

  const onDown = (ev)=>{
    const person = people.find(p=>p.id===circle.dataset.id);
    if(!person) return;
    dragging = true;
    circle.dataset.dragged = '0';
    const pt = ev.touches ? ev.touches[0] : ev;
    startX = pt.clientX; startY = pt.clientY;
    startPosX = person.posX; startPosY = person.posY;
    ev.preventDefault();
  };
  const onMove = (ev)=>{
    if(!dragging) return;
    const person = people.find(p=>p.id===circle.dataset.id);
    if(!person) return;
    const pt = ev.touches ? ev.touches[0] : ev;
    const dx = pt.clientX - startX;
    const dy = pt.clientY - startY;
    if(Math.abs(dx)>3 || Math.abs(dy)>3) circle.dataset.dragged = '1';
    const rect = circle.getBoundingClientRect();
    const newX = Math.min(100, Math.max(0, startPosX - (dx/rect.width)*100));
    const newY = Math.min(100, Math.max(0, startPosY - (dy/rect.height)*100));
    person.posX = newX; person.posY = newY;
    img.style.objectPosition = `${newX}% ${newY}%`;
  };
  const onUp = ()=>{ dragging = false; };

  circle.addEventListener('mousedown', onDown);
  circle.addEventListener('touchstart', onDown, {passive:false});
  window.addEventListener('mousemove', onMove);
  window.addEventListener('touchmove', onMove, {passive:false});
  window.addEventListener('mouseup', onUp);
  window.addEventListener('touchend', onUp);
}

/* ---------------- 共用：畫面切換 / 語音 / 音效 ---------------- */
function showScreen(id){
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}

let audioCtx = null;
function getCtx(){
  if(!audioCtx) audioCtx = new (window.AudioContext||window.webkitAudioContext)();
  if(audioCtx.state==='suspended') audioCtx.resume();
  return audioCtx;
}
function speak(text){
  if(muted) return;
  if(!('speechSynthesis' in window)) return;
  try{
    window.speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang='zh-TW'; u.rate=0.92; u.pitch=1.1;
    window.speechSynthesis.speak(u);
  }catch(e){}
}
function playChime(good){
  if(muted) return;
  try{
    const ctx=getCtx(); const t0=ctx.currentTime;
    const osc=ctx.createOscillator(); const gain=ctx.createGain();
    osc.type='sine';
    if(good){
      osc.frequency.setValueAtTime(520,t0);
      osc.frequency.exponentialRampToValueAtTime(780,t0+0.15);
    }else{
      osc.frequency.setValueAtTime(300,t0);
      osc.frequency.exponentialRampToValueAtTime(220,t0+0.2);
    }
    gain.gain.setValueAtTime(0.0001,t0);
    gain.gain.exponentialRampToValueAtTime(0.3,t0+0.02);
    gain.gain.exponentialRampToValueAtTime(0.0001,t0+0.3);
    osc.connect(gain).connect(ctx.destination);
    osc.start(t0); osc.stop(t0+0.32);
  }catch(e){}
}
function updateMuteIcons(){
  document.getElementById('muteLearn').textContent = muted?'🔇':'🔊';
  document.getElementById('muteQuiz').textContent = muted?'🔇':'🔊';
  document.getElementById('muteMatch').textContent = muted?'🔇':'🔊';
}
document.getElementById('muteLearn').addEventListener('click', ()=>{muted=!muted; updateMuteIcons();});
document.getElementById('muteQuiz').addEventListener('click', ()=>{muted=!muted; updateMuteIcons();});
document.getElementById('muteMatch').addEventListener('click', ()=>{muted=!muted; updateMuteIcons();});

/* ---------------- 學習模式 ---------------- */
function startLearn(list){
  getCtx();
  document.getElementById('learnTopTitle').textContent = `🖐️ 點點認識我 · ${getCurrentTopic().name}`;
  const grid = document.getElementById('learnGrid');
  grid.innerHTML='';
  list.forEach(person=>{
    const card = document.createElement('div');
    card.className='learn-card';
    card.innerHTML = `
      <div class="learn-photo"><img src="${person.photo}" style="object-position:${person.posX||50}% ${person.posY||42}%"></div>
      <div class="learn-name">${person.label}</div>
    `;
    card.addEventListener('click', ()=>{
      card.classList.add('bounce');
      setTimeout(()=>card.classList.remove('bounce'), 250);
      playChime(true);
      speak(`這是${person.label}`);
    });
    grid.appendChild(card);
  });
  showScreen('screen-learn');
}

let currentTarget = null;

function nextQuizRound(){
  if(!quizActive) return;
  document.getElementById('quizRound').textContent = quizRound;
  const shuffled = [...quizList].sort(()=>Math.random()-0.5);
  const optionCount = Math.min(4, shuffled.length);
  const options = shuffled.slice(0, optionCount).sort(()=>Math.random()-0.5);
  currentTarget = options[Math.floor(Math.random()*options.length)];

  document.getElementById('quizQuestionText').textContent = `${currentTarget.label}在哪裡？`;
  const cols = optionCount<=2 ? optionCount : (optionCount===3?3:2);
  const grid = document.getElementById('quizGrid');
  grid.style.gridTemplateColumns = `repeat(${optionCount<=3?optionCount:2}, 1fr)`;
  grid.innerHTML='';

  options.forEach(person=>{
    const card = document.createElement('div');
    card.className='quiz-card';
    card.innerHTML = `
      <div class="quiz-photo"><img src="${person.photo}" style="object-position:${person.posX||50}% ${person.posY||42}%"></div>
      <div class="quiz-name">${person.label}</div>
    `;
    card.addEventListener('click', ()=> onQuizPick(card, person));
    grid.appendChild(card);
  });

  setTimeout(()=> speak(`${currentTarget.label}在哪裡？`), 300);
}

document.getElementById('replayBtn').addEventListener('click', ()=>{
  if(currentTarget) speak(`${currentTarget.label}在哪裡？`);
});

function onQuizPick(card, person){
  if(!quizActive) return;
  if(person.id === currentTarget.id){
    card.classList.add('correctFlash');
    playChime(true);
    speak(`答對了！這是${person.label}！`);
    quizScore++;
    document.getElementById('quizScore').textContent = quizScore;
    showPraise(card);
    quizActive = false;
    setTimeout(()=>{
      quizActive = true;
      quizRound++;
      nextQuizRound();
    }, 1400);
  } else {
    card.classList.add('shake');
    playChime(false);
    setTimeout(()=> card.classList.remove('shake'), 400);
    setTimeout(()=> speak(`再聽一次，${currentTarget.label}在哪裡？`), 500);
  }
}

function showPraise(card){
  const words = ['太棒了!','答對了!','好厲害!','真聰明!'];
  const p = document.createElement('div');
  p.className='praise';
  p.textContent = words[Math.floor(Math.random()*words.length)];
  document.getElementById('screen-quiz').appendChild(p);
  setTimeout(()=>{ if(p.parentNode) p.parentNode.removeChild(p); }, 900);
}

/* ---------------- 記憶配對模式 ---------------- */
let matchState = { cards:[], flipped:[], moves:0, found:0, total:0, locked:false };
let lastMatchList = [];

function startMatch(list){
  getCtx();
  document.getElementById('matchTopTitle').textContent = `🧩 記憶配對 · ${getCurrentTopic().name}`;
  lastMatchList = list;
  const pool = [...list].sort(()=>Math.random()-0.5).slice(0, Math.min(6, list.length));
  let cards = [];
  pool.forEach(person=>{
    cards.push({uid: person.id+'_a', personId: person.id, person});
    cards.push({uid: person.id+'_b', personId: person.id, person});
  });
  cards.sort(()=>Math.random()-0.5);

  matchState = {cards, flipped:[], moves:0, found:0, total:pool.length, locked:false};
  document.getElementById('matchMoves').textContent = 0;
  document.getElementById('matchFound').textContent = 0;
  document.getElementById('matchTotal').textContent = pool.length;
  document.getElementById('matchComplete').style.display = 'none';

  const grid = document.getElementById('matchGrid');
  const total = cards.length;
  const cols = total<=6 ? 3 : (total<=8 ? 4 : (total<=10 ? 5 : 4));
  grid.style.gridTemplateColumns = `repeat(${cols}, 1fr)`;
  grid.innerHTML = '';

  cards.forEach(c=>{
    const el = document.createElement('div');
    el.className = 'match-card';
    el.innerHTML = `
      <div class="match-card-inner">
        <div class="match-face match-back">❓</div>
        <div class="match-face match-front"><img src="${c.person.photo}" style="object-position:${c.person.posX||50}% ${c.person.posY||42}%"></div>
      </div>
    `;
    el.addEventListener('click', ()=> onCardClick(el, c));
    grid.appendChild(el);
  });

  showScreen('screen-match');
}

function onCardClick(el, card){
  if(matchState.locked) return;
  if(el.classList.contains('flipped') || el.classList.contains('matched')) return;
  if(matchState.flipped.length >= 2) return;

  el.classList.add('flipped');
  speak(card.person.label);
  matchState.flipped.push({el, card});

  if(matchState.flipped.length === 2){
    matchState.moves++;
    document.getElementById('matchMoves').textContent = matchState.moves;
    matchState.locked = true;
    const [a,b] = matchState.flipped;

    if(a.card.personId === b.card.personId){
      setTimeout(()=>{
        a.el.classList.add('matched');
        b.el.classList.add('matched');
        matchState.found++;
        document.getElementById('matchFound').textContent = matchState.found;
        playChime(true);
        matchState.flipped = [];
        matchState.locked = false;
        if(matchState.found === matchState.total){
          setTimeout(()=> finishMatch(), 500);
        }
      }, 500);
    } else {
      setTimeout(()=>{
        a.el.classList.remove('flipped');
        b.el.classList.remove('flipped');
        playChime(false);
        matchState.flipped = [];
        matchState.locked = false;
      }, 850);
    }
  }
}

function finishMatch(){
  document.getElementById('matchCompleteText').textContent = `你用了 ${matchState.moves} 次就配對成功，好棒！`;
  document.getElementById('matchComplete').style.display = 'flex';
}

document.getElementById('btnMatchReplay').addEventListener('click', ()=> startMatch(lastMatchList));
document.getElementById('btnMatchMenu').addEventListener('click', ()=> showScreen('screen-setup'));

})();
</script>
