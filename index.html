function speak(text, rate = 0.65) {
  try {
    if (!window.speechSynthesis) return;
    window.speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = "zh-TW";
    u.rate = rate;
    u.pitch = 1.15;
    window.speechSynthesis.speak(u);
  } catch (e) {}
}

function speakMany(texts, rate = 0.65) {
  try {
    if (!window.speechSynthesis) return;
    window.speechSynthesis.cancel();
    texts.forEach((t) => {
      const u = new SpeechSynthesisUtterance(t);
      u.lang = "zh-TW";
      u.rate = rate;
      u.pitch = 1.15;
      window.speechSynthesis.speak(u);
    });
  } catch (e) {}
}

function playApplause() {
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const now = ctx.currentTime;
    for (let i = 0; i < 6; i++) {
      const t = now + i * 0.09 + Math.random() * 0.04;
      const bufferSize = Math.floor(ctx.sampleRate * 0.09);
      const buffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
      const data = buffer.getChannelData(0);
      for (let j = 0; j < bufferSize; j++) {
        data[j] = (Math.random() * 2 - 1) * Math.exp(-j / (bufferSize * 0.28));
      }
      const noise = ctx.createBufferSource();
      noise.buffer = buffer;
      const filter = ctx.createBiquadFilter();
      filter.type = "highpass";
      filter.frequency.value = 1200;
      const gain = ctx.createGain();
      gain.gain.setValueAtTime(0.45, t);
      noise.connect(filter);
      filter.connect(gain);
      gain.connect(ctx.destination);
      noise.start(t);
    }
  } catch (e) {}
}

function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function FindItAdventure() {
  const [sceneId, setSceneId] = useState(null);
  const [order, setOrder] = useState([]);
  const [idx, setIdx] = useState(0);
  const [found, setFound] = useState({});
  const [popup, setPopup] = useState(null);
  const [peek, setPeek] = useState(null);
  const [hint, setHint] = useState(false);
  const timeoutRef = useRef(null);

  const scene = SCENES.find((s) => s.id === sceneId);
  const target = order[idx];

  useEffect(() => {
    if (target) {
      const t = setTimeout(
        () => speakMany([`${target.label}在哪裡？找找看`, target.label, target.label]),
        350
      );
      return () => clearTimeout(t);
    }
  }, [target]);

  function enterScene(s) {
    setSceneId(s.id);
    setOrder(shuffle(s.items));
    setIdx(0);
    setFound({});
    setPopup(null);
    setHint(false);
  }

  function tapItem(item) {
    if (!target) return;
    if (item.id === target.id) {
      setFound((f) => ({ ...f, [item.id]: true }));
      setPopup({ item, success: true });
      playApplause();
      speakMany([item.label, item.label]);
      setHint(false);
      clearTimeout(timeoutRef.current);
      timeoutRef.current = setTimeout(() => {
        setPopup(null);
        setIdx((i) => i + 1);
      }, 1900);
    } else {
      setPeek(item.id);
      speak(item.label, 0.65);
      setTimeout(() => setPeek(null), 1000);
    }
  }

  const allFound = scene && idx >= order.length;

  return (
    <div style={{
      fontFamily: "'Baloo 2', 'Nunito', sans-serif",
      minHeight: "100vh",
      background: "radial-gradient(circle at 20% 10%, #FFF6E6 0%, #FDEFD9 40%, #F7E3BE 100%)",
      color: "#4A3B2A", display: "flex", flexDirection: "column",
      alignItems: "center", padding: "18px 14px 40px", boxSizing: "border-box",
    }}>
      <style>{`
        @import url('https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Nunito:wght@500;700&display=swap');
        * { box-sizing: border-box; }
        button { font-family: inherit; cursor: pointer; }
        @keyframes pop { 0% { transform: scale(0.5) translateY(20px); opacity:0 } 70% { transform: scale(1.06); opacity:1 } 100% { transform: scale(1) translateY(0); } }
        @keyframes softPulse { 0%,100% { box-shadow: 0 0 0 0 rgba(255,214,89,0.7); } 50% { box-shadow: 0 0 0 14px rgba(255,214,89,0); } }
        @keyframes peekIn { 0% { transform: scale(0.6) translateY(6px); opacity:0 } 100% { transform: scale(1) translateY(0); opacity:1 } }
        @keyframes clapBounce { 0%,100% { transform: scale(1) rotate(-4deg); } 50% { transform: scale(1.18) rotate(4deg); } }
        @keyframes idleBob { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-3%); } }
        .item-btn { transition: transform 0.15s ease; }
        .item-btn:active { transform: scale(0.9); }
        @media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
      `}</style>

      {!sceneId && (
        <div style={{ width: "100%", maxWidth: 1200 }}>
          <div style={{ fontSize: 24, fontWeight: 800, marginBottom: 2 }}>找找看大冒險</div>
          <div style={{ fontSize: 13, opacity: 0.65, marginBottom: 18, fontWeight: 500 }}>
            選一幅畫，聽聽看要找什麼，點對了會跳出大大的圖片！
          </div>
          <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 14 }}>
            {SCENES.map((s) => (
              <button key={s.id} onClick={() => enterScene(s)} style={{
                background: s.ground, border: `3px solid ${s.accent}`, borderRadius: 20,
                padding: "20px 8px 16px", display: "flex", flexDirection: "column",
                alignItems: "center", gap: 6, boxShadow: `0 4px 0 ${s.accent}`,
              }}>
                <div style={{ fontSize: 38 }}>{s.emoji}</div>
                <div style={{ fontWeight: 800, fontSize: 16 }}>{s.name}</div>
                <div style={{ fontSize: 11, opacity: 0.65, fontWeight: 600 }}>{s.items.length} 個東西</div>
              </button>
            ))}
          </div>
        </div>
      )}

      {scene && (
        <div style={{ width: "100%", maxWidth: 1200 }}>
          <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", marginBottom: 12 }}>
            <button onClick={() => setSceneId(null)} style={{ background: "none", border: "none", fontWeight: 700, fontSize: 14, color: "#8A6B3F" }}>
              ← 換一幅畫
            </button>
            <div style={{ background: "#fff", border: "2px solid #F2C94C", borderRadius: 999, padding: "6px 14px", fontWeight: 700, fontSize: 14 }}>
              ⭐ {Object.keys(found).length}/{scene.items.length}
            </div>
          </div>

          {!allFound && target && (
            <div style={{
              background: "#fff", border: `2px solid ${scene.accent}`, borderRadius: 16,
              padding: "10px 14px", marginBottom: 12, display: "flex",
              alignItems: "center", justifyContent: "space-between",
            }}>
              <div style={{ fontSize: 15, fontWeight: 800 }}>🔍 {target.label}在哪裡？</div>
              <div style={{ display: "flex", gap: 6 }}>
                <button onClick={() => speakMany([`${target.label}在哪裡？找找看`, target.label, target.label])}
                  style={{ background: "#F1E9DA", border: "none", borderRadius: 999, padding: "6px 10px", fontSize: 13, fontWeight: 700 }}>
                  🔊
                </button>
                <button onClick={() => { setHint(true); setTimeout(() => setHint(false), 2200); }}
                  style={{ background: "#FFE9B3", border: "none", borderRadius: 999, padding: "6px 10px", fontSize: 13, fontWeight: 700 }}>
                  💡 提示
                </button>
              </div>
            </div>
          )}

          <div style={{
            position: "relative", width: "100%", aspectRatio: "16 / 8", borderRadius: 22,
            overflow: "hidden", border: "6px solid #fff",
            boxShadow: `0 0 0 4px ${scene.accent}, 0 10px 0 rgba(0,0,0,0.08)`,
            background: `linear-gradient(to bottom, ${scene.sky} 0%, ${scene.sky} ${scene.horizon}%, ${scene.ground} ${scene.horizon}%, ${scene.ground} 100%)`,
          }}>
            {scene.deco.map((d, i) => (
              <div key={i} style={{
                position: "absolute", top: `${d.top}%`, left: `${d.left}%`, fontSize: d.size,
                transform: "translate(-50%,-50%)", opacity: 0.85, pointerEvents: "none",
              }}>{d.emoji}</div>
            ))}

            {scene.items.map((item, i) => {
              const isTarget = target && target.id === item.id;
              const isFound = found[item.id];
              const showPeek = peek === item.id;
              const bobDelay = (i % 5) * 0.35;
              return (
                <div key={item.id} style={{ position: "absolute", top: `${item.top}%`, left: `${item.left}%`, transform: "translate(-50%,-50%)" }}>
                  <div style={{
                    width: "62%", height: "18%",
                    background: "radial-gradient(ellipse, rgba(0,0,0,0.22) 0%, rgba(0,0,0,0) 72%)",
                    position: "absolute", bottom: -6, left: "50%", transform: "translateX(-50%)", pointerEvents: "none",
                  }} />
                  <button className="item-btn" onClick={() => tapItem(item)} style={{
                    fontSize: item.size, background: "none", border: "none", lineHeight: 1,
                    filter: isFound
                      ? "grayscale(0.15) drop-shadow(0 6px 5px rgba(0,0,0,0.25))"
                      : "drop-shadow(0 6px 5px rgba(0,0,0,0.28)) saturate(1.12)",
                    position: "relative", display: "inline-block",
                    animation: hint && isTarget ? "softPulse 1s ease-in-out infinite" : `idleBob 3.2s ease-in-out ${bobDelay}s infinite`,
                    borderRadius: "50%",
                  }}>
                    {item.img ? (
                      <img src={item.img} alt={item.label} style={{ width: item.size, height: "auto", display: "block", pointerEvents: "none" }} />
                    ) : (
                      item.emoji
                    )}
                    {isFound && <span style={{ position: "absolute", top: -6, right: -6, fontSize: 16 }}>⭐</span>}
                  </button>
                  {showPeek && (
                    <div style={{
                      position: "absolute", bottom: "100%", left: "50%", transform: "translateX(-50%)",
                      background: "#fff", border: "2px solid #EEE3CC", borderRadius: 10, padding: "3px 8px",
                      fontSize: 12, fontWeight: 700, whiteSpace: "nowrap", animation: "peekIn 0.2s ease-out", marginBottom: 4,
                    }}>{item.label}</div>
                  )}
                </div>
              );
            })}
          </div>

          {allFound && (
            <div style={{ marginTop: 18, textAlign: "center", background: "#FFF3D0", border: "2px solid #F2C94C", borderRadius: 18, padding: "18px", fontWeight: 800 }}>
              🎉 這幅畫都找完了，太棒了！
              <div style={{ marginTop: 10 }}>
                <button onClick={() => setSceneId(null)} style={{ background: scene.accent, color: "#fff", border: "none", borderRadius: 999, padding: "8px 20px", fontWeight: 700 }}>
                  換下一幅畫
                </button>
              </div>
            </div>
          )}
        </div>
      )}

      {popup && (
        <div style={{ position: "fixed", inset: 0, background: "rgba(74,59,42,0.4)", display: "flex", alignItems: "center", justifyContent: "center", zIndex: 20, padding: 20 }}>
          <div style={{
            background: "#fff", borderRadius: 28, padding: "34px 30px", textAlign: "center",
            animation: "pop 0.4s ease-out", border: `4px solid ${scene?.accent || "#F2A65A"}`, minWidth: 220,
          }}>
            <div style={{ fontSize: 26, marginBottom: 4, animation: "clapBounce 0.6s ease-in-out infinite" }}>👏 👏 👏</div>
            {popup.item.img ? (
              <img src={popup.item.img} alt={popup.item.label} style={{ width: 150, height: "auto", margin: "0 auto 8px", display: "block" }} />
            ) : (
              <div style={{ fontSize: 90, marginBottom: 8 }}>{popup.item.emoji}</div>
            )}
            <div style={{ fontSize: 30, fontWeight: 800 }}>{popup.item.label}</div>
            <div style={{ fontSize: 22, marginTop: 6 }}>⭐ 找到了！好棒！</div>
          </div>
        </div>
      )}
    </div>
  );
}
