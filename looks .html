       全域聲音與音效控制（專為語言訓練優化）
       ========================================== */
    let isSoundOn = true;
    let synth = window.speechSynthesis;

    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    function playBeep(freq = 520, duration = 0.15, type = 'sine') {
      if (!isSoundOn) return;
      try {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
        gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + duration);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + duration);
      } catch (e) {}
    }

    function playHappyFanfare() {
      if (!isSoundOn) return;
      const notes = [392, 523, 659, 784, 1046];
      notes.forEach((freq, index) => {
        setTimeout(() => playBeep(freq, 0.18, 'triangle'), index * 90);
      });
    }

    // 清晰朗讀語音（語速較慢、音調溫和）
    function speakText(text, callback) {
      if (!isSoundOn || !synth) {
        if (callback) callback();
        return;
      }
      synth.cancel();
      const utterance = new SpeechSynthesisUtterance(text);
      utterance.lang = 'zh-TW';
      utterance.rate = 0.75; // 放慢語速，方便語言遲緩孩童辨識音素
      utterance.pitch = 1.2;
      if (callback) {
        utterance.onend = callback;
      }
      synth.speak(utterance);
    }

        { name: '黃色圓圈', speechName: '黃色圓圈', emoji: '🟡', color: 'bg-amber-100 border-amber-300' }
      ],

      // 8. 🌻 自然植物
      nature: [
        { name: '太陽', speechName: '太陽', emoji: '☀️', color: 'bg-amber-100 border-amber-300' },
        { name: '月亮', speechName: '月亮', emoji: '🌙', color: 'bg-yellow-100 border-yellow-300' },
        { name: '彩虹', speechName: '彩虹', emoji: '🌈', color: 'bg-pink-100 border-pink-300' },
        { name: '雲朵', speechName: '雲朵', emoji: '☁️', color: 'bg-sky-100 border-sky-300' },
        { name: '雨滴', speechName: '雨滴', emoji: '💧', color: 'bg-blue-100 border-blue-300' },
        { name: '花朵', speechName: '花朵', emoji: '🌸', color: 'bg-rose-100 border-rose-300' },
        { name: '大樹', speechName: '大樹', emoji: '🌳', color: 'bg-emerald-100 border-emerald-300' },
        { name: '樹葉', speechName: '樹葉', emoji: '🍃', color: 'bg-teal-100 border-teal-300' },
        { name: '向日葵', speechName: '向日葵', emoji: '🌻', color: 'bg-orange-100 border-orange-300' },
        { name: '蘑菇', speechName: '蘑菇', emoji: '🍄', color: 'bg-red-100 border-red-300' }
      ]
    };

    let currentCategory = 'number';
    let currentTargetItem = null;
    let totalScore = 0;

    /* ==========================================
       遊戲核心邏輯
       ========================================== */
    function switchTab(catKey) {
      currentCategory = catKey;
      playBeep(550, 0.1);

      // 切換按鈕亮起狀態
      document.querySelectorAll('nav button').forEach(btn => {
        btn.classList.remove('bg-pink-500', 'text-white');
        btn.classList.add('bg-white', 'text-gray-800');
      });

      const activeBtn = document.getElementById(`tab-${catKey}`);
      if (activeBtn) {
        activeBtn.classList.remove('bg-white', 'text-gray-800');
        activeBtn.classList.add('bg-pink-500', 'text-white');
      }

      generateQuestion();
    }

    function generateQuestion() {
      const itemsList = database[currentCategory];
      
      // 隨機選取 4 個不重複項目
      const shuffled = [...itemsList].sort(() => Math.random() - 0.5);
      const selectedFour = shuffled.slice(0, 4);

      // 決定正確目標
      currentTargetItem = selectedFour[Math.floor(Math.random() * selectedFour.length)];

      // 更新主畫面題目文字
      document.getElementById('target-title-text').innerText = `【${currentTargetItem.name}】`;

      // 渲染選項 grid (2x2)
      const grid = document.getElementById('options-grid');
      grid.innerHTML = '';

      selectedFour.forEach(item => {
        const btn = document.createElement('button');
        btn.className = `btn-cute ${item.color} rounded-3xl p-4 sm:p-6 border-4 flex flex-col items-center justify-center transform active:scale-95 transition-all shadow-xl min-h-[170px] sm:min-h-[210px]`;

        if (currentCategory === 'number') {
          // 數字模式：呈現【阿拉伯數字 + 實物圖案數量】
          btn.innerHTML = `
            <div class="flex items-center justify-center gap-2 mb-1">
              <span class="text-5xl sm:text-7xl font-black text-purple-900">${item.num}</span>
            </div>
            <div class="text-2xl sm:text-3xl tracking-widest break-all px-2 line-clamp-2">${item.displayItems}</div>
            <span class="text-xl sm:text-2xl font-black text-gray-700 mt-2">${item.name}</span>
          `;
        } else {
          // 一般認知模式
          btn.innerHTML = `
            <span class="text-7xl sm:text-8xl drop-shadow-md">${item.emoji}</span>
            <span class="text-2xl sm:text-3xl font-black text-gray-800 mt-2">${item.name}</span>
          `;
        }

        btn.onclick = (e) => checkAnswer(item, btn, e);
        grid.appendChild(btn);
      });

      // 發出語音提示
      setTimeout(() => {
        playPromptSound();
      }, 300);
    }

    function playPromptSound() {
      if (currentTargetItem) {
        if (currentCategory === 'number') {
          speakText(`請找出：${currentTargetItem.speechName}`);
        } else {
          speakText(`請找出：${currentTargetItem.name}`);
        }
      }
    }

    function checkAnswer(item, btnElement, event) {
      if (item.name === currentTargetItem.name) {
        // 答對了！
        totalScore++;
        document.getElementById('score-count').innerText = totalScore;

        playHappyFanfare();
        createParticles(event.clientX, event.clientY);

        // 顯示不擋畫面的右上角大拇指👍
        showThumbFeedback();

        // 正向語音回饋「好棒👍！」
        speakText(`好棒👍！找到了 ${item.name}！`, () => {
          setTimeout(() => {
            generateQuestion();
          }, 800);
        });

      } else {
        // 點錯提示
        btnElement.classList.add('animate-shake');
        playBeep(220, 0.25, 'sawtooth');
        speakText(`這是${item.name}，再試試看喔！`);
        setTimeout(() => {
          btnElement.classList.remove('animate-shake');
        }, 500);
      }
    }

    // 右上角不擋畫面的大拇指👍動畫
    function showThumbFeedback() {
      const thumb = document.getElementById('thumb-feedback');
      thumb.classList.remove('hidden');
      setTimeout(() => {
        thumb.classList.add('hidden');
      }, 1200);
    }

    function createParticles(x, y) {
      const icons = ['✨', '💖', '🌟', '🎉', '🎈'];
      for (let i = 0; i < 6; i++) {
        const p = document.createElement('div');
        p.className = 'particle text-4xl sm:text-5xl font-black';
        p.innerText = icons[Math.floor(Math.random() * icons.length)];
        p.style.left = (x + (Math.random() * 80 - 40)) + 'px';
        p.style.top = (y + (Math.random() * 80 - 40)) + 'px';
        document.body.appendChild(p);
        setTimeout(() => p.remove(), 1200);
      }
    }

    function toggleSound() {
      isSoundOn = !isSoundOn;
      const soundIcon = document.getElementById('soundIcon');
      if (isSoundOn) {
        soundIcon.className = 'fas fa-volume-up text-3xl sm:text-4xl';
        playBeep(600, 0.1);
        speakText('聲音開啟');
      } else {
        soundIcon.className = 'fas fa-volume-mute text-3xl sm:text-4xl text-gray-400';
        if (synth) synth.cancel();
      }
    }

    window.onload = () => {
      switchTab('number'); // 預設開啟數字 1-10 教學找找看
    };
  </script>
</body>
</html>
